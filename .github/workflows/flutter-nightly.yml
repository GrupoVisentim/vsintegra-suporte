name: Flutter Nightly Build

# VS Integra: só manual (Actions > Flutter Nightly Build > Run workflow). A compilação automática toda noite foi tirada.
on:
  workflow_dispatch:

jobs:
  run-flutter-nightly-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"